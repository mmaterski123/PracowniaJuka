<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pracownia JUKA — kontakt</title>
<meta name="description" content="Pracownia krawiecka JUKA, Konin — dane kontaktowe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #EDE4D3;
    --espresso: #3B2A20;
    --brass: #A67C3D;
    --brass-dark: #8A6530;
    --muted: #6B5B4D;
    --line: #C9B896;
    --font-display: "Bitter", Georgia, serif;
    --font-body: "Work Sans", -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--parchment);
    color: var(--espresso);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    display: flex;
    align-items: stretch;
    max-width: 780px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .card-logo {
    flex: 0 0 42%;
    background: #000;
  }

  .card-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-content {
    flex: 1;
    padding: 44px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    font-size: 0.9rem;
    color: var(--brass-dark);
    margin: 0 0 10px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 1.8rem;
    margin: 0 0 18px;
    line-height: 1.2;
  }

  .stitch {
    border-top: 2px dashed var(--line);
    margin: 0 0 22px;
  }

  .contact-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .contact-list li {
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 1.02rem;
  }

  .contact-list li:last-child { border-bottom: none; }

  .contact-label {
    display: block;
    font-size: 0.8rem;
    color: var(--brass-dark);
    margin-bottom: 2px;
  }

  .contact-list a {
    color: var(--espresso);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }

  .contact-list a:hover { border-bottom-color: var(--brass); }

  @media (max-width: 560px) {
    .card { flex-direction: column; }
    .card-logo { flex: 0 0 auto; aspect-ratio: 1 / 1; }
    .card-content { padding: 32px 26px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-logo">
      <img src="assets/juka_logo.jpg" alt="Logo Pracownia JUKA">
    </div>
    <div class="card-content">
      <p class="eyebrow">Pracownia krawiecka · Konin</p>
      <h1>Strona w przygotowaniu.<br>Zapraszamy do kontaktu:</h1>
      <div class="stitch"></div>
      <ul class="contact-list">
        <li>
          <span class="contact-label">Telefon</span>
          <a href="tel:+48666858530">666 858 530</a>
        </li>
        <li>
          <span class="contact-label">E-mail</span>
          <a href="mailto:pracownia.juka@wp.pl">pracownia.juka@wp.pl</a>
        </li>
        <li>
          <span class="contact-label">Facebook</span>
          <a href="https://www.facebook.com/pracownia.juka" target="_blank" rel="noopener">facebook.com/pracownia.juka</a>
        </li>
      </ul>
    </div>
  </div>

</body>
</html>
